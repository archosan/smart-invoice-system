<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-label="document-service tek durum sahibi; servisler yalnızca RabbitMQ üzerinden konuşur" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Akıllı Fatura İşleme ve Sözleşme Uyum Sistemi — Mimari</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8A8F98"/>
    </marker>
  </defs>

  <!-- Arka plan: GitHub koyu temada da okunur kalsın -->
  <rect x="0" y="0" width="760" height="392" rx="12" fill="#FFFFFF"/>

  <text x="24" y="30" font-size="15" font-weight="600" fill="#1F2328">document-service tek durum sahibi; servisler yalnızca RabbitMQ üzerinden konuşur</text>

  <!-- Bağlantılar -->
  <g fill="none" stroke="#8A8F98" stroke-width="1.25">
    <!-- Kullanıcılar: REST yalnızca insanların kapısı; üç servise ortak hat -->
    <path d="M110 108V160" marker-end="url(#arrow)"/>
    <path d="M110 134H420V160" marker-end="url(#arrow)"/>
    <path d="M250 134V160" marker-end="url(#arrow)"/>
    <!-- compliance → Ollama ortak hattı keser; kesişimde boşluk -->
    <path d="M330 140V128" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M470 160V108" marker-end="url(#arrow)"/>
    <path d="M330 160V80H388" marker-end="url(#arrow)"/>
    <path d="M650 160V108" marker-end="url(#arrow)"/>
    <path d="M110 264V304" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M290 264V304" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M470 264V304" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M650 264V304" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>

  <!-- Üst sıra: kullanıcılar ve dış bileşenler -->
  <g text-anchor="middle">
    <rect x="28" y="52" width="168" height="56" rx="8" fill="none" stroke="#8A8F98" stroke-width="1.25"/>
    <text x="112" y="76" font-weight="600" fill="#1F2328">Kullanıcılar</text>
    <text x="112" y="94" font-size="11.5" fill="#57606A">uzman, onaycı, yönetici</text>

    <rect x="388" y="52" width="164" height="56" rx="8" fill="none" stroke="#8A8F98" stroke-width="1.25"/>
    <text x="470" y="76" font-weight="600" fill="#1F2328">Ollama (macOS)</text>
    <text x="470" y="94" font-size="11.5" fill="#57606A">LLM + bge-m3</text>

    <rect x="568" y="52" width="164" height="56" rx="8" fill="none" stroke="#8A8F98" stroke-width="1.25"/>
    <text x="650" y="76" font-weight="600" fill="#1F2328">Mock eski portal</text>
    <text x="650" y="94" font-size="11.5" fill="#57606A">API yok, yalnızca HTML</text>
  </g>

  <!-- Servisler -->
  <g text-anchor="middle">
    <rect x="28" y="160" width="164" height="104" rx="8" fill="#2F6FDB" fill-opacity="0.12" stroke="#2F6FDB" stroke-width="2"/>
    <text x="110" y="184" font-weight="600" fill="#1F2328">document-service</text>
    <text x="110" y="204" font-size="11.5" fill="#1F2328">orkestratör, REST API</text>
    <text x="110" y="220" font-size="11.5" fill="#1F2328">durum makinesi, outbox</text>
    <text x="110" y="236" font-size="11.5" fill="#57606A">document_db</text>
    <text x="110" y="252" font-size="11.5" fill="#57606A">PDF volume (yazar)</text>

    <rect x="208" y="160" width="164" height="104" rx="8" fill="none" stroke="#8A8F98" stroke-width="1.25"/>
    <text x="290" y="184" font-weight="600" fill="#1F2328">compliance-service</text>
    <text x="290" y="204" font-size="11.5" fill="#1F2328">sözleşme REST, RAG</text>
    <text x="290" y="220" font-size="11.5" fill="#1F2328">fiyat ve vade uyumu</text>
    <text x="290" y="236" font-size="11.5" fill="#57606A">compliance_db</text>
    <text x="290" y="252" font-size="11.5" fill="#57606A">+ pgvector</text>

    <rect x="388" y="160" width="164" height="104" rx="8" fill="none" stroke="#8A8F98" stroke-width="1.25"/>
    <text x="470" y="184" font-weight="600" fill="#1F2328">extraction-service</text>
    <text x="470" y="204" font-size="11.5" fill="#1F2328">PDFBox + LLM</text>
    <text x="470" y="220" font-size="11.5" fill="#1F2328">kurallar, güven skoru</text>
    <text x="470" y="236" font-size="11.5" fill="#57606A">extraction_db</text>
    <text x="470" y="252" font-size="11.5" fill="#57606A">PDF volume (okur)</text>

    <rect x="568" y="160" width="164" height="104" rx="8" fill="none" stroke="#8A8F98" stroke-width="1.25"/>
    <text x="650" y="184" font-weight="600" fill="#1F2328">rpa-service</text>
    <text x="650" y="204" font-size="11.5" fill="#1F2328">Playwright bot</text>
    <text x="650" y="220" font-size="11.5" fill="#1F2328">tek aktif consumer</text>
    <text x="650" y="236" font-size="11.5" fill="#57606A">rpa_db</text>
    <text x="650" y="252" font-size="11.5" fill="#57606A">Redis kilidi, ön arama</text>
  </g>

  <!-- RabbitMQ -->
  <g text-anchor="middle">
    <rect x="28" y="304" width="704" height="66" rx="8" fill="#EEF0F3" stroke="#8A8F98" stroke-width="1.25"/>
    <text x="380" y="324" font-weight="600" fill="#1F2328">RabbitMQ</text>
    <text x="380" y="342" font-size="11.5" fill="#57606A">invoice.commands (direct) · invoice.events (topic) · invoice.dlx → kuyruk başına DLQ</text>
    <text x="380" y="358" font-size="11.5" fill="#57606A">invoice.retry → portal bekleme odası (30 sn sonra invoice.commands'a döner)</text>
  </g>

  <!-- Bağlantı etiketleri -->
  <g font-size="11.5" fill="#57606A">
    <text x="150" y="128">REST</text>
    <text x="338" y="124">HTTP</text>
    <text x="478" y="140">HTTP</text>
    <text x="642" y="140" text-anchor="end">tarayıcı (HTML)</text>
  </g>
</svg>
