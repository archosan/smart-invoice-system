# Topoloji + uygulama kullanıcısı açılışta yüklenir (ADR-17).
# Dosya init-user.sh tarafından definitions.json'dan üretilir.
load_definitions = /tmp/rabbitmq/definitions.json

# Konteyner bellek limitiyle aynı (docker-compose.yml, mem_limit 512m; B-31). RabbitMQ cgroup limitini görmez ve
# bellek alarmını VM'in toplam belleğine göre hesaplar (B-31'de 4,99 GB ölçüldü): alarm hiç çalmadan konteyner
# OOM ile öldürülürdü. Bu değerle varsayılan eşik (%60) ~307 MB olur; aşılınca yayıncılar yavaşlatılır.
total_memory_available_override_value = 512MB

# Disk alarmı: boş alan bunun altına inince yayıncılar durdurulur. Varsayılan 50 MB'ta (B-30) disk alarm çalmadan
# doldu ve broker'ın iç veritabanı (kullanıcı, vhost, kuyruklar) silindi; 1 GB metadata'ya yazacak yer bırakır.
disk_free_limit.absolute = 1GB
